name: Test Agent AI Plug Realtor OS

# Manual-only while this product kit is under active build.
# This prevents failure emails on every intermediate commit.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Generate demo outputs
        run: python -m agent_ai_plug.operator

      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: agent-ai-plug-demo-output
          path: output/
